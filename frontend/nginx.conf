server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    location /api/ { proxy_pass http://backend:8000/; proxy_set_header Host $host; }
    # 联合试验联邦中心（独立 stdlib 服务，只含汇总，无原始节拍）
    location /federation/ { proxy_pass http://federation-center:8010/; proxy_set_header Host $host; }
    location = /federation { return 301 /federation/; }
    location / { try_files $uri $uri/ /index.html; }
}
